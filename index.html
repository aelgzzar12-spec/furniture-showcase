<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Royal Furniture — Timeless Designs</title>

  <meta
    name="description"
    content="Royal Furniture — timeless furniture and refined interiors designed for modern living."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --cream: #f5f1e9;
      --cream-dark: #ebe4d8;
      --white: #fffdf9;
      --ink: #1b1a17;
      --muted: #716c64;
      --line: rgba(27, 26, 23, .12);
      --brown: #8a684d;
      --accent: #8a684d;
      --dark: #20201d;
      --radius: 24px;
      --container: 1240px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background: var(--cream);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      width: 100%;
    }

    button {
      font-family: inherit;
    }

    .container {
      width: min(var(--container), calc(100% - 40px));
      margin: auto;
    }

    /* =========================
       HEADER
    ========================== */

    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      padding: 22px 0;
      color: white;
    }

    .nav {
      width: min(var(--container), calc(100% - 40px));
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: .5px;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
    }

    .nav-links a {
      position: relative;
      opacity: .9;
      transition: .3s;
    }

    .nav-links a:hover {
      opacity: 1;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 0;
      height: 1px;
      background: white;
      transition: .3s;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .customize-btn {
      padding: 11px 19px;
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 999px;
      font-size: 13px;
      transition: .3s;
      backdrop-filter: blur(8px);
      background: rgba(255,255,255,.08);
    }

    .customize-btn:hover {
      background: white;
      color: var(--ink);
    }

    .nav-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 20px;
      transition: .3s;
    }

    .nav-icon:hover {
      background: rgba(255,255,255,.12);
    }

    .menu-btn {
      display: none;
      border: 0;
      background: transparent;
      color: white;
      font-size: 28px;
      cursor: pointer;
      width: 42px;
      height: 42px;
    }

    /* =========================
       MOBILE MENU
    ========================== */

    .mobile-menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.48);
      z-index: 80;
      opacity: 0;
      visibility: hidden;
      transition: .35s ease;
      backdrop-filter: blur(3px);
    }

    .mobile-menu-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .mobile-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: min(340px, 88%);
      height: 100vh;
      background: var(--white);
      color: var(--ink);
      z-index: 90;
      padding: 100px 30px 30px;
      box-shadow: -15px 0 45px rgba(0,0,0,.18);
      transition: right .4s cubic-bezier(.22,1,.36,1);
      overflow-y: auto;
    }

    .mobile-menu.active {
      right: 0;
    }

    .mobile-menu-close {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 24px;
    }

    .mobile-menu .mobile-brand {
      font-family: "Playfair Display", serif;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .mobile-menu a {
      display: block;
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
      font-size: 16px;
      transition: .25s;
    }

    .mobile-menu a:hover {
      padding-left: 8px;
      color: var(--brown);
    }

    .mobile-menu .mobile-customize {
      margin-top: 28px;
      padding: 14px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      text-align: center;
    }

    /* =========================
       HERO
    ========================== */

    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
      color: white;
      background: #222;
    }

    .hero-slides {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .hero-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      background-position: center;
      background-size: cover;
      transform: scale(1.08);
      animation: heroSlide 18s infinite;
    }

    .hero-slide:nth-child(1) {
      background-image: url("https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=2200&q=90");
      animation-delay: 0s;
    }

    .hero-slide:nth-child(2) {
      background-image: url("https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=2200&q=90");
      animation-delay: 6s;
    }

    .hero-slide:nth-child(3) {
      background-image: url("https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=2200&q=90");
      animation-delay: 12s;
    }

    @keyframes heroSlide {
      0% {
        opacity: 0;
        transform: scale(1.08);
      }

      8% {
        opacity: 1;
      }

      30% {
        opacity: 1;
        transform: scale(1);
      }

      38% {
        opacity: 0;
        transform: scale(1);
      }

      100% {
        opacity: 0;
      }
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(
          90deg,
          rgba(15,14,12,.78) 0%,
          rgba(15,14,12,.45) 48%,
          rgba(15,14,12,.25) 100%
        );
    }

    .hero::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 160px;
      z-index: 2;
      background: linear-gradient(
        transparent,
        rgba(245,241,233,.9)
      );
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 3;
      width: min(var(--container), calc(100% - 40px));
      margin: auto;
      padding-top: 80px;
    }

    .hero-eyebrow {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 22px;
      opacity: .9;
    }

    .hero h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(52px, 7vw, 100px);
      line-height: .98;
      max-width: 850px;
      font-weight: 600;
      letter-spacing: -2px;
    }

    .hero-text {
      max-width: 570px;
      margin-top: 28px;
      font-size: 17px;
      line-height: 1.8;
      color: rgba(255,255,255,.86);
    }

    .hero-buttons {
      display: flex;
      gap: 14px;
      margin-top: 34px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 25px;
      border-radius: 999px;
      font-size: 14px;
      transition: .3s;
      cursor: pointer;
    }

    .btn-light {
      background: white;
      color: var(--ink);
    }

    .btn-light:hover {
      transform: translateY(-3px);
    }

    .btn-outline {
      border: 1px solid rgba(255,255,255,.7);
      color: white;
      background: rgba(255,255,255,.04);
      backdrop-filter: blur(8px);
    }

    .btn-outline:hover {
      background: white;
      color: var(--ink);
    }

    /* =========================
       SECTION
    ========================== */

    section {
      padding: 110px 0;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 30px;
      margin-bottom: 42px;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--brown);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .section-title {
      font-family: "Playfair Display", serif;
      font-size: clamp(38px, 5vw, 62px);
      line-height: 1.05;
      font-weight: 600;
    }

    .section-description {
      max-width: 480px;
      color: var(--muted);
      line-height: 1.8;
    }

    /* =========================
       CATEGORIES
    ========================== */

    .categories {
      background: var(--cream);
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    .category-card {
      position: relative;
      height: 340px;
      overflow: hidden;
      border-radius: var(--radius);
      color: white;
      background: #333;
    }

    .category-card img {
      height: 100%;
      object-fit: cover;
      transition: transform .8s ease;
    }

    .category-card:hover img {
      transform: scale(1.07);
    }

    .category-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        transparent 35%,
        rgba(0,0,0,.68)
      );
    }

    .category-name {
      position: absolute;
      z-index: 2;
      bottom: 24px;
      left: 22px;
      font-family: "Playfair Display", serif;
      font-size: 25px;
    }

    /* =========================
       STORY
    ========================== */

    .story {
      background: var(--white);
    }

    .story-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      align-items: center;
    }

    .story-image {
      border-radius: 30px;
      overflow: hidden;
      height: 650px;
    }

    .story-image img {
      height: 100%;
      object-fit: cover;
      transition: transform 1s ease;
    }

    .story-image:hover img {
      transform: scale(1.04);
    }

    .story-content h2 {
      font-family: "Playfair Display", serif;
      font-size: clamp(42px, 5vw, 68px);
      line-height: 1.05;
      margin-bottom: 25px;
    }

    .story-content p {
      color: var(--muted);
      line-height: 1.9;
      margin-bottom: 18px;
      max-width: 560px;
    }

    .text-link {
      display: inline-block;
      margin-top: 18px;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 5px;
      font-size: 14px;
    }

    /* =========================
       PRODUCTS
    ========================== */

    .products {
      background: var(--cream);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px 18px;
    }

    .product-card {
      position: relative;
      min-width: 0;
    }

    .product-image {
      height: 420px;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--cream-dark);
      position: relative;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
